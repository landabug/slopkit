<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 // SLOPKIT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    :root{
        --bg:#05060a;
        --panel:rgba(16,18,26,0.72);
        --line:rgba(120,160,255,0.14);
        --cyan:#39e6ff;
        --blue:#4f7fd6;
        --violet:#a06bff;
        --green:#16c60c;
        --red:#e74856;
        --amber:#ffb347;
        --text:#e6ecff;
        --dim:#6b7894;
    }

    *{ box-sizing:border-box; }

    html,body{ height:100%; }

    body{
        margin:0;
        padding:0;
        overflow:hidden;
        user-select:none;
        -webkit-user-select:none;
        background:var(--bg);
        color:var(--text);
        font-family:"Inter","Segoe UI",Arial,sans-serif;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    /* ---------- animated backdrop ---------- */
    .bg{
        position:fixed; inset:0; z-index:0; pointer-events:none;
        background:
            radial-gradient(1200px 700px at 15% -10%, rgba(79,127,214,0.20), transparent 60%),
            radial-gradient(900px 600px at 110% 110%, rgba(160,107,255,0.16), transparent 60%),
            radial-gradient(700px 500px at 50% 50%, rgba(57,230,255,0.06), transparent 70%);
    }
    .grid{
        position:fixed; inset:-2px; z-index:0; pointer-events:none;
        background-image:
            linear-gradient(rgba(120,160,255,0.055) 1px, transparent 1px),
            linear-gradient(90deg, rgba(120,160,255,0.055) 1px, transparent 1px);
        background-size:44px 44px;
        mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
        -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
        animation:drift 22s linear infinite;
    }
    @keyframes drift{
        from{ background-position:0 0, 0 0; }
        to{ background-position:44px 88px, 88px 44px; }
    }
    .scan{
        position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.35;
        background:repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.020) 0px,
            rgba(255,255,255,0.020) 1px,
            transparent 1px,
            transparent 3px
        );
    }

    /* ---------- card ---------- */
    .wrap{
        position:relative; z-index:2;
        width:min(560px, 92vw);
        padding:34px 30px 26px;
        border-radius:22px;
        background:var(--panel);
        border:1px solid var(--line);
        backdrop-filter:blur(18px) saturate(140%);
        -webkit-backdrop-filter:blur(18px) saturate(140%);
        box-shadow:
            0 0 0 1px rgba(255,255,255,0.03) inset,
            0 30px 90px rgba(0,0,0,0.65),
            0 0 70px rgba(79,127,214,0.14);
        animation:rise .7s cubic-bezier(.2,.8,.25,1) both;
    }
    @keyframes rise{
        from{ opacity:0; transform:translateY(18px) scale(.98); }
        to{ opacity:1; transform:none; }
    }

    /* ---------- header ---------- */
    .top{
        display:flex; align-items:center; gap:12px;
        margin-bottom:22px;
    }
    .badge{
        width:34px; height:34px; border-radius:10px;
        background:linear-gradient(140deg,var(--blue),var(--violet));
        display:grid; place-items:center;
        font-weight:900; font-size:15px; letter-spacing:-1px; color:#fff;
        box-shadow:0 0 22px rgba(120,140,255,0.55);
        flex:0 0 auto;
    }
    .titles{ line-height:1.15; }
    .t1{
        font-size:19px; font-weight:900; letter-spacing:2.4px;
        text-transform:uppercase;
        background:linear-gradient(90deg,#fff,var(--cyan) 55%,var(--violet));
        -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .t2{
        font-size:10.5px; letter-spacing:2.6px; text-transform:uppercase;
        color:var(--dim); font-weight:700;
    }
    .pulse{
        margin-left:auto; display:flex; align-items:center; gap:7px;
        font-size:10px; letter-spacing:1.6px; font-weight:800;
        color:var(--dim); text-transform:uppercase;
    }
    .dot{
        width:8px; height:8px; border-radius:50%;
        background:var(--dim); box-shadow:0 0 0 0 rgba(0,0,0,0);
    }
    .dot.on{ background:var(--green); box-shadow:0 0 12px var(--green); animation:blink 1.6s ease-in-out infinite; }
    .dot.warn{ background:var(--amber); box-shadow:0 0 12px var(--amber); animation:blink 1.1s ease-in-out infinite; }
    .dot.err{ background:var(--red); box-shadow:0 0 12px var(--red); }
    @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

    /* ---------- hero image ---------- */
    .hero{
        display:flex; justify-content:center;
        margin:4px 0 24px;
    }
    .hero img{
        width:220px; max-width:56vw;
        border-radius:14px;
        box-shadow:
            0 0 0 2px #2a2a2e,
            0 0 30px 6px rgba(79,127,214,0.35);
        transition:transform .35s ease, box-shadow .35s ease;
    }
    .hero img:hover{
        transform:translateY(-3px) scale(1.02);
        box-shadow:
            0 0 0 2px var(--cyan),
            0 0 46px 10px rgba(57,230,255,0.45);
    }

    /* ---------- info rows ---------- */
    .rows{
        display:grid; gap:8px; margin-bottom:22px;
    }
    .row{
        display:flex; align-items:center; gap:10px;
        padding:9px 12px;
        border-radius:11px;
        background:rgba(255,255,255,0.028);
        border:1px solid rgba(255,255,255,0.05);
        font-size:12px;
        font-family:"JetBrains Mono","Consolas",monospace;
    }
    .k{ color:var(--dim); letter-spacing:1px; text-transform:uppercase; font-size:10.5px; font-weight:700; }
    .v{ margin-left:auto; color:var(--text); font-weight:700; }
    .v.ok{ color:var(--green); }
    .v.warn{ color:var(--amber); }
    .v.err{ color:var(--red); }
    .v.dim{ color:var(--dim); }

    /* ---------- button ---------- */
    .btn{
        position:relative;
        width:100%;
        padding:17px 22px;
        border:none; outline:none; cursor:pointer;
        border-radius:14px;
        font-size:15px; font-weight:900;
        letter-spacing:3px; text-transform:uppercase;
        color:#04070f;
        background:linear-gradient(100deg,var(--cyan),var(--blue) 48%,var(--violet));
        background-size:200% 100%;
        box-shadow:
            0 10px 34px rgba(79,127,214,0.42),
            0 0 0 1px rgba(255,255,255,0.12) inset;
        transition:transform .16s ease, box-shadow .3s ease, background-position .5s ease;
        overflow:hidden;
        font-family:inherit;
    }
    .btn:hover{
        transform:translateY(-2px);
        background-position:100% 0;
        box-shadow:
            0 16px 46px rgba(120,140,255,0.55),
            0 0 0 1px rgba(255,255,255,0.2) inset;
    }
    .btn:active{ transform:translateY(0) scale(.99); }
    .btn::after{
        content:"";
        position:absolute; top:0; left:-60%;
        width:45%; height:100%;
        background:linear-gradient(100deg,transparent,rgba(255,255,255,0.55),transparent);
        transform:skewX(-18deg);
        animation:sheen 3.6s ease-in-out infinite;
    }
    @keyframes sheen{
        0%,72%{ left:-60%; }
        92%,100%{ left:130%; }
    }
    .btn.disabled{
        cursor:not-allowed;
        pointer-events:none;
        background:linear-gradient(100deg,#1a1d26,#20242f);
        color:#4b5568;
        box-shadow:0 0 0 1px rgba(255,255,255,0.05) inset;
    }
    .btn.disabled::after{ display:none; }

    /* ---------- terminal ---------- */
    .term{
        margin-top:18px;
        border-radius:13px;
        background:rgba(0,0,0,0.45);
        border:1px solid rgba(255,255,255,0.055);
        overflow:hidden;
    }
    .term-bar{
        display:flex; align-items:center; gap:7px;
        padding:8px 12px;
        background:rgba(255,255,255,0.025);
        border-bottom:1px solid rgba(255,255,255,0.05);
    }
    .dot3{ width:9px; height:9px; border-radius:50%; }
    .d1{ background:#ff5f57; } .d2{ background:#febc2e; } .d3{ background:#28c840; }
    .term-title{
        margin-left:8px; font-size:10px; letter-spacing:1.8px;
        color:var(--dim); text-transform:uppercase; font-weight:700;
        font-family:"JetBrains Mono","Consolas",monospace;
    }
    .term-body{
        padding:11px 13px;
        font-family:"JetBrains Mono","Consolas",monospace;
        font-size:11px; line-height:1.7;
        color:#8ea3c8;
        height:96px;
        overflow:hidden;
        display:flex; flex-direction:column; justify-content:flex-end;
    }
    .term-body .l{ white-space:pre; }
    .term-body .p{ color:var(--cyan); }
    .term-body .g{ color:var(--green); }
    .term-body .a{ color:var(--amber); }
    .term-body .r{ color:var(--red); }
    .cursor{
        display:inline-block; width:7px; height:12px;
        background:var(--cyan); vertical-align:-2px;
        animation:cur 1s steps(1) infinite;
    }
    @keyframes cur{ 0%,50%{ opacity:1; } 51%,100%{ opacity:0; } }

    .foot{
        margin-top:14px; text-align:center;
        font-size:9.5px; letter-spacing:2.4px; text-transform:uppercase;
        color:#3d4761; font-weight:700;
    }
</style>
</head>
<body>

<div class="bg"></div>
<div class="grid"></div>
<div class="scan"></div>

<div class="wrap">

    <div class="top">
        <div class="badge">PS</div>
        <div class="titles">
            <div class="t1">Slopkit</div>
            <div class="t2">Renderer Notify Chain</div>
        </div>
        <div class="pulse">
            <span class="dot" id="dot"></span>
            <span id="link">init</span>
        </div>
    </div>

    <div class="hero">
        <img id="cat" src="cat.jpg" alt="">
    </div>

    <div class="rows">
        <div class="row"><span class="k">Firmware</span><span class="v dim" id="rFw">—</span></div>
        <div class="row"><span class="k">Offset Set</span><span class="v dim" id="rSet">—</span></div>
        <div class="row"><span class="k">Payload</span><span class="v dim" id="rPay">notify.html</span></div>
        <div class="row"><span class="k">Status</span><span class="v dim" id="rStat">standby</span></div>
    </div>

    <a tabindex="0" class="btn disabled" id="run">Run Exploit</a>

    <div class="term">
        <div class="term-bar">
            <span class="dot3 d1"></span><span class="dot3 d2"></span><span class="dot3 d3"></span>
            <span class="term-title">boot log</span>
        </div>
        <div class="term-body" id="log"></div>
    </div>

    <div class="foot">for research &amp; preservation only</div>

</div>

<script>
"use strict";

const EXPLOIT_URL = "notify.html";
const OFFSETS_URL = "offsets/offsets.json";

const run   = document.getElementById("run");
const logEl = document.getElementById("log");
const dot   = document.getElementById("dot");
const link  = document.getElementById("link");
const rFw   = document.getElementById("rFw");
const rSet  = document.getElementById("rSet");
const rStat = document.getElementById("rStat");

/* ---------- terminal logger ---------- */
const MAX_LINES = 5;
const lines = [];

function term(text, cls){
    lines.push({ text, cls: cls || "" });
    if (lines.length > MAX_LINES) lines.shift();
    logEl.innerHTML = lines
        .map(function(l, i){
            const last = i === lines.length - 1;
            return '<div class="l ' + l.cls + '">' + l.text +
                   (last ? ' <span class="cursor"></span>' : '') + '</div>';
        })
        .join("");
}

function setLink(state, label){
    dot.className = "dot" + (state ? " " + state : "");
    link.textContent = label;
}

function setStatus(text, cls){
    rStat.textContent = text;
    rStat.className = "v " + (cls || "dim");
}

/* ---------- firmware detection ---------- */
const m = /PlayStation 5\/(\d+)\.(\d+)/.exec(navigator.userAgent);
const fw = m ? `${m[1].padStart(2,"0")}.${m[2].padStart(2,"0")}` : null;

let entry = null;

function fwNum(s){
    const p = s.split(".");
    return parseInt(p[0],10) * 100 + parseInt(p[1],10);
}

/* Nearest known firmware within the SAME major. */
function nearest(data, target){
    const want = fwNum(target);
    const maj  = target.split(".")[0];
    let best = null, bestd = 1e9;
    for (const k in data){
        if (k.split(".")[0] !== maj) continue;
        const d = Math.abs(fwNum(k) - want);
        if (d < bestd){ bestd = d; best = k; }
    }
    return best;
}

/* ---------- boot ---------- */
term('<span class="p">$</span> slopkit --init', "");
term('loading offsets...', "");
setLink("", "init");

rFw.textContent = fw || "n/a";
rFw.className = "v " + (fw ? "" : "err");

if (!fw){
    setLink("err", "no ps5");
    term('no PS5 user-agent detected', "r");
    setStatus("not a ps5 browser", "err");
} else {
    term('firmware ' + fw + ' detected', "g");
}

fetch(OFFSETS_URL, { cache:"no-store" })
    .then(function(r){ return r.json(); })
    .then(function(data){

        term('offsets table loaded', "g");

        if (!fw){
            return;
        }

        entry = data[fw];

        if (entry){
            setLink("on", "ready");
            run.classList.remove("disabled");
            rSet.textContent = fw + " (exact)";
            rSet.className = "v ok";
            setStatus("armed", "ok");
            term('exact offset set: ' + fw, "g");
            return;
        }

        const near = nearest(data, fw);

        if (near){
            entry = data[near];
            setLink("warn", "fallback");
            run.classList.remove("disabled");
            rSet.textContent = near + " (fallback)";
            rSet.className = "v warn";
            setStatus("unverified offsets", "warn");
            term('no exact set for ' + fw + ' -> using ' + near, "a");
            term('cross-check will fail safe', "a");
        } else {
            setLink("err", "unsupported");
            setStatus("firmware not supported", "err");
            rSet.textContent = "none";
            rSet.className = "v err";
            term('no offset set for major ' + fw.split(".")[0], "r");
        }
    })
    .catch(function(){
        setLink("err", "fetch fail");
        setStatus("failed to load offsets", "err");
        term('failed to load ' + OFFSETS_URL, "r");
    });

/* ---------- launch ---------- */
run.addEventListener("click", function(){
    if (!entry) return;

    const q = new URLSearchParams();
    q.set("go", "1");
    q.set("fw", fw);
    q.set("hc", entry.hc.join(","));
    q.set("gd", entry.gd);
    q.set("notify", entry.nt);
    q.set("gps", entry.gps);
    q.set("gpe", entry.gpe);
    q.set("cls", entry.cls);
    q.set("cle", entry.cle);
    q.set("ers", entry.ers);
    q.set("ere", entry.ere);

    run.classList.add("disabled");
    setLink("warn", "launching");
    setStatus("handing off", "warn");
    term('<span class="p">$</span> exec notify.html', "p");
    term('offsets staged for ' + rSet.textContent, "");

    setTimeout(function(){
        location.href = `${EXPLOIT_URL}?${q.toString()}`;
    }, 420);
});

/* keyboard: enter / space */
document.addEventListener("keydown", function(e){
    if ((e.key === "Enter" || e.key === " ") && !run.classList.contains("disabled")){
        run.click();
    }
});
</script>
</body>
</html>
