<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Payload Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body{
        user-select:none; -webkit-user-select:none;
        background-color:#0c0c0f; color:#fff; font-family:Arial;
        display:flex; flex-direction:column; align-items:center;
        min-height:100vh; margin:0; padding:32px 16px; box-sizing:border-box;
    }
    h1{
        font-size:20px; font-weight:800; letter-spacing:3px;
        text-transform:uppercase; margin:0 0 4px 0; text-align:center;
    }
    p.sub{
        font-size:12px; color:#8a8a92; margin:0 0 26px 0;
        letter-spacing:1px; text-align:center;
    }
    .list{
        width:min(520px, 92vw);
        display:flex; flex-direction:column; gap:10px;
    }
    .item{
        display:flex; align-items:center; gap:14px;
        padding:14px 16px;
        background:#141519;
        border:1px solid #23242a;
        border-radius:12px;
    }
    .item .name{
        font-weight:800; letter-spacing:1px; font-size:15px;
    }
    .item .desc{
        color:#8a8a92; font-size:12px; margin-top:3px;
    }
    .item .go{
        margin-left:auto;
        padding:9px 16px;
        background:#202125;
        border:none; border-radius:9px;
        color:#fff; font-weight:800; font-size:13px; letter-spacing:1px;
        cursor:pointer; font-family:inherit;
        transition:background-color 0.2s ease;
    }
    .item .go:hover{ background-color:#a2a2a6; color:#202020; }
    .item .go:disabled{ opacity:0.45; pointer-events:none; }
    #status{
        margin-top:22px; font-size:12px; color:#8a8a92;
        letter-spacing:1px; min-height:1.2em; text-align:center;
    }
    .back{
        margin-top:26px; font-size:12px; color:#8a8a92;
        letter-spacing:1px; text-decoration:none;
    }
    .back:hover{ color:#fff; }
</style>
</head>
<body>
<h1>Payload Manager</h1>
<p class="sub">semi-jailbreak &mdash; 13.60 and below</p>

<div class="list">
    <div class="item">
        <div>
            <div class="name">hwPS slopkit v0.1</div>
            <div class="desc">renderer notify chain &mdash; sandbox escape proof</div>
        </div>
        <button class="go" id="runHwps">Run</button>
    </div>
</div>

<div id="status"></div>
<a class="back" href="index.html">&larr; back</a>

<script>
"use strict";
const status = document.getElementById("status");
const runHwps = document.getElementById("runHwps");
const OFFSETS_URL = "offsets/offsets.json";
const EXPLOIT_URL = "notify.html";

const m = /PlayStation 5\/(\d+)\.(\d+)/.exec(navigator.userAgent);
const fw = m ? `${m[1].padStart(2, "0")}.${m[2].padStart(2, "0")}` : null;

let entry = null;

function fwNum(s) {
    const p = s.split(".");
    return parseInt(p[0], 10) * 100 + parseInt(p[1], 10);
}
function nearest(data, target) {
    const want = fwNum(target);
    const maj = target.split(".")[0];
    let best = null, bestd = 1e9;
    for (const k in data) {
        if (k.split(".")[0] !== maj) continue;
        const d = Math.abs(fwNum(k) - want);
        if (d < bestd) { bestd = d; best = k; }
    }
    return best;
}

fetch(OFFSETS_URL, { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
        if (!fw) { status.textContent = "not a PS5 browser"; return; }
        entry = data[fw] || data[nearest(data, fw)] || null;
        status.textContent = entry ? "ready" : "firmware not supported";
    })
    .catch(function () { status.textContent = "failed to load offsets"; });

runHwps.addEventListener("click", function () {
    if (!entry) return;
    status.textContent = "re-running hwPS slopkit v0.1...";
    runHwps.disabled = true;
    const q = new URLSearchParams();
    q.set("go", "1");
    q.set("fw", fw);
    q.set("hc", entry.hc.join(","));
    q.set("gd", entry.gd);
    q.set("notify", entry.nt);
    q.set("gps", entry.gps);
    q.set("gpe", entry.gpe);
    q.set("cls", entry.cls);
    q.set("cle", entry.cle);
    q.set("ers", entry.ers);
    q.set("ere", entry.ere);
    location.href = `${EXPLOIT_URL}?${q.toString()}`;
});
</script>
</body>
</html>
